spring:
  config:
    name: novel_factory-app
  profiles:
    active: dev
  ai:
    retry:
      # 传输层不重试（重试收权到业务层，避免 5xx 时 token 白烧 10 次）
      max-attempts: 3

novel:
  llm:
    connect-timeout-seconds: 20
    read-timeout-seconds: 1800
    chatgpt-retry:
      # OAuth Responses API 不经过 Spring AI retry：此处独立做指数退避、抖动与共享冷却。
      max-attempts: 4
      initial-backoff-ms: 5000
      max-backoff-ms: 60000
